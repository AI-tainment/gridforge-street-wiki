<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240" height="90" role="img" class="anim-svg">
<title>Lamp-pair playback</title>
<style>
.anim-svg .lamp { stroke:#141414; stroke-width:2; }
.anim-svg .a { fill:#F5D000; animation:sw-flash 1.0000s steps(1,end) infinite; }
.anim-svg .b { fill:#F5D000; animation:sw-flash 1.0000s steps(1,end) infinite; animation-delay:0.5000s; }
@keyframes sw-flash {
  0%,49.9% { fill:#F5D000; }
  50%,100% { fill:#2A2A28; }
}
@media (prefers-reduced-motion: reduce) {
  .anim-svg .a, .anim-svg .b { animation: none; fill:#F5D000; }
}
</style>
<rect x="1" y="1" width="238" height="88" rx="8" fill="#1a1a1c" stroke="#6E6C66" stroke-width="2"/>
<circle class="lamp a" cx="80" cy="45" r="22"/>
<circle class="lamp b" cx="160" cy="45" r="22"/>
</svg>
